# Render Blueprint — backend API + Postgres.
# The frontend deploys separately on Vercel (see DEPLOY.md).
#
# In the Render dashboard: New > Blueprint, point it at this repo.
# After the first deploy, fill in GEMINI_API_KEY and set FRONTEND_URL
# to your Vercel URL.

databases:
  - name: hex-db
    databaseName: hex_business
    plan: free

services:
  - type: web
    name: hex-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hex-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: HEX_SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false          # set in the dashboard
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: GEMINI_TIMEOUT_MS
        value: "25000"
      - key: FRONTEND_URL
        sync: false          # set to your Vercel URL after the frontend deploys
      - key: HEX_SCHEDULER_ENABLED
        value: "true"
      - key: HEX_SYNC_INTERVAL_MINUTES
        value: "30"
      - key: WEB_CONCURRENCY
        value: "1"           # keep 1 worker: the auto-sync scheduler runs in-process
