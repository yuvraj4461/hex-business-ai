# Render Blueprint — backend API + Postgres.
# The existing "hex-business-ai backend" service was set up by hand; this
# file documents the settings it should use and lets you recreate it.
# Frontend deploys on Vercel (see DEPLOY.md).

databases:
  - name: hex-postgres
    databaseName: hex_business
    plan: free

services:
  - type: web
    name: hex-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bootstrap.py && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.1"
      - key: DATABASE_URL
        fromDatabase:
          name: hex-postgres
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: HEX_SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false          # set in the dashboard
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_TIMEOUT_MS
        value: "25000"
      - key: FRONTEND_URL
        sync: false          # your Vercel production URL
      - key: HEX_SCHEDULER_ENABLED
        value: "true"
      - key: HEX_SYNC_INTERVAL_MINUTES
        value: "30"
      - key: WEB_CONCURRENCY
        value: "1"           # 1 worker: the auto-sync scheduler runs in-process
